<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noise-picker examples</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --border: #333;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #c8ff00;
  }
  body {
    font-family: monospace;
    background: var(--bg);
    color: var(--text);
    padding: 60px 40px;
    margin: 0;
    min-height: 100vh;
  }
  h1 {
    color: var(--accent);
    font-size: 24px;
    margin-bottom: 8px;
  }
  p.lead {
    color: var(--dim);
    margin-bottom: 40px;
    font-size: 14px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    max-width: 720px;
  }
  a.card {
    display: block;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
  }
  a.card:hover {
    border-color: var(--accent);
  }
  .card h2 {
    font-size: 16px;
    color: var(--accent);
    margin: 0 0 8px;
  }
  .card p {
    font-size: 13px;
    color: var(--dim);
    margin: 0;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>noise-picker examples</h1>
<p class="lead">SoundDetector ライブラリのサンプルプログラム</p>

<div class="cards">
  <a class="card" href="sound-sampler.html">
    <h2>Sound Sampler</h2>
    <p>検出したい音を録音して、プロファイルJSONを生成するツール。3〜5回サンプルを録って閾値を設定するだけ。</p>
  </a>
  <a class="card" href="example.html">
    <h2>SoundDetector デモ</h2>
    <p>プロファイルを読み込んでリアルタイム検出を試すデモ。スコアの可視化やパラメータ調整ができる。</p>
  </a>
</div>

</body>
</html>
